services:
  backend:
    build: ./backend
    environment:
      CACHE_SECONDS: ${CACHE_SECONDS:-900}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
